# Sobe tudo com:  docker compose up --build
# API:      http://localhost:3001/api        Swagger: http://localhost:3001/api/docs
# RabbitMQ: http://localhost:15672 (guest / guest)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: condominio_moradores
    ports:
      - "3307:3306" # 3307 no seu PC, para não colidir com um MySQL local na 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: mysql://root:root@db:3306/condominio_moradores
      PORT: 3001
      # use um segredo forte fora de demonstrações (pode definir JWT_SECRET no seu .env)
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-forte-e-unico}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-Admin@12345}
    restart: unless-stopped

volumes:
  mysql_data:
