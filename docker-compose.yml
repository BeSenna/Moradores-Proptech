# Sobe a API + RabbitMQ. O MySQL 5.7 NÃO roda aqui: é o servidor da faculdade (edumysql.acesso.rj.senac.br).
#
# As variáveis (DATABASE_URL, JWT_SECRET, ADMIN_SENHA...) vêm do ambiente e NUNCA ficam escritas neste arquivo.
# Com Infisical (padrão da equipe):
#   npx infisical run --env=dev -- docker compose up --build
# Sem Infisical: crie um .env ao lado deste arquivo com as mesmas variáveis e rode  docker compose up --build
#
# API:      http://localhost:7522/condominio/morador        Swagger: http://localhost:7522/condominio/morador/docs
# RabbitMQ: http://localhost:15672 (guest / guest)
# As tabelas já existem no servidor (criadas pelo professor); o síndico inicial é criado pela própria API (ADMIN_LOGIN/ADMIN_SENHA).
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "7522:7522"
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (Infisical ou .env)}
      PORT: 7522
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (Infisical ou .env)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
    restart: unless-stopped